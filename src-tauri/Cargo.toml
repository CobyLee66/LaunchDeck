[package]
name = "sysservicehelper"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
sys-locale = "0.3"

[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = "s"
